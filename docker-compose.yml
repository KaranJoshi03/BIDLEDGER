version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bidledger-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bidledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bidledger-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  neo4j:
    image: neo4j:5-community
    container_name: bidledger-neo4j
    environment:
      NEO4J_AUTH: neo4j/bidledger_secret
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4jdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidledger-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/bidledger
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: bidledger_secret
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_started

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidledger-celery-worker
    command: celery -A app.services.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/bidledger
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: bidledger_secret
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bidledger-celery-beat
    command: celery -A app.services.celery_app.celery_app beat --loglevel=info
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bidledger-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  neo4jdata:
